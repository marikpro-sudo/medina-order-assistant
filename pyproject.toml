[project]
name = "medina-order-assistant"
version = "0.1.0"
description = "AI order assistant for a pharmaceutical distributor's B2B portal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "xlwt>=1.3",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/medina", "data_access", "data"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "data/tests"]
pythonpath = [".", "backend"]
